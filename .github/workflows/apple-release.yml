name: Apple signed release and update channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (for example 2.0.0)
        required: true
        default: 2.0.0
        type: string
      build:
        description: Monotonic build number
        required: true
        default: '204'
        type: string
      upload_to_testflight:
        description: Upload the signed IPA to App Store Connect/TestFlight
        required: true
        default: true
        type: boolean
      build_macos_app_store:
        description: Build the sandboxed macOS App Store edition (requires the three MAC_* secrets)
        required: true
        default: false
        type: boolean
      upload_macos_to_testflight:
        description: Upload the sandboxed macOS package (only when build_macos_app_store is enabled)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apple-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Check Apple agent version consistency
        run: python3 scripts/ci/check_version_consistency.py
      - name: Test update channel configuration
        run: python3 scripts/ci/test_update_channel_config.py
      - name: Test macOS bootstrap and installer safety
        run: python3 scripts/ci/test_macos_bootstrap_safety.py
      - name: Test core, contracts and command security
        run: swift test --package-path Packages/iWebITCore
      - name: Validate release inputs and scripts
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${{ inputs.build }}" =~ ^[1-9][0-9]*$ ]]
          bash -n scripts/ci/*.sh scripts/release/*.sh scripts/release/package-scripts/*
          swift scripts/release/prepare-mobile-app-icon.swift \
            iWebITAgent/Assets.xcassets/AppIcon.appiconset/logo_1024.png \
            "$RUNNER_TEMP/AppIcon-1024.png"
          [[ "$(sips -g pixelWidth "$RUNNER_TEMP/AppIcon-1024.png" | awk '/pixelWidth:/ {print $2}')" == "1024" ]]
          [[ "$(sips -g pixelHeight "$RUNNER_TEMP/AppIcon-1024.png" | awk '/pixelHeight:/ {print $2}')" == "1024" ]]
          [[ "$(sips -g hasAlpha "$RUNNER_TEMP/AppIcon-1024.png" | awk '/hasAlpha:/ {print $2}')" == "no" ]]
          find Documentation -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done

  macos-installer:
    needs: verify
    runs-on: macos-15
    environment: apple-release
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
      DEVELOPER_ID_INSTALLER_IDENTITY: ${{ secrets.DEVELOPER_ID_INSTALLER_IDENTITY }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      RELEASE_TAG: v${{ inputs.version }}-${{ inputs.build }}
      PACKAGE_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}-${{ inputs.build }}/iWebIT-${{ inputs.version }}-${{ inputs.build }}.pkg
      UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/update-manifest.json
    steps:
      - uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
          IWEBIT_UPDATE_PRIVATE_KEY_BASE64: ${{ secrets.IWEBIT_UPDATE_PRIVATE_KEY_BASE64 }}
          IWEBIT_UPDATE_KEY_ID: ${{ secrets.IWEBIT_UPDATE_KEY_ID }}
          IWEBIT_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.IWEBIT_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          bash scripts/ci/validate-required-secrets.sh \
            APPLE_TEAM_ID \
            DEVELOPER_ID_APPLICATION_IDENTITY \
            DEVELOPER_ID_INSTALLER_IDENTITY \
            DEVELOPER_ID_APPLICATION_P12_BASE64 \
            DEVELOPER_ID_INSTALLER_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            CI_KEYCHAIN_PASSWORD \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID \
            NOTARY_PRIVATE_KEY_BASE64 \
            IWEBIT_UPDATE_PRIVATE_KEY_BASE64 \
            IWEBIT_UPDATE_KEY_ID \
            IWEBIT_UPDATE_PUBLIC_KEY_BASE64

      - name: Install XcodeGen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Import Developer ID certificates
        env:
          APP_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          APP_CERT="$RUNNER_TEMP/developer-id-application.p12"
          INSTALLER_CERT="$RUNNER_TEMP/developer-id-installer.p12"
          KEYCHAIN="$RUNNER_TEMP/iwebit-signing.keychain-db"
          echo -n "$APP_P12" | base64 --decode > "$APP_CERT"
          echo -n "$INSTALLER_P12" | base64 --decode > "$INSTALLER_CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APP_CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$INSTALLER_CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

      - name: Create trusted update channel configuration
        env:
          UPDATE_PUBLIC_KEY: ${{ secrets.IWEBIT_UPDATE_PUBLIC_KEY_BASE64 }}
          UPDATE_KEY_ID: ${{ secrets.IWEBIT_UPDATE_KEY_ID }}
        run: |
          python3 scripts/release/create-update-channel.py \
            --manifest-url "$UPDATE_MANIFEST_URL" \
            --key-id "$UPDATE_KEY_ID" \
            --public-key-base64 "$UPDATE_PUBLIC_KEY" \
            --expected-team-id "$APPLE_TEAM_ID" \
            --interval-seconds 21600 \
            --output "$RUNNER_TEMP/update-channel.json"
          echo "UPDATE_CHANNEL_CONFIG_PATH=$RUNNER_TEMP/update-channel.json" >> "$GITHUB_ENV"

      - name: Build signed pkg
        run: |
          chmod +x scripts/release/build-signed-package.sh scripts/release/package-scripts/*
          scripts/release/build-signed-package.sh \
            "${{ inputs.version }}" \
            "${{ inputs.build }}" \
            "$RUNNER_TEMP/release"

      - name: Notarize and staple
        env:
          NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          echo -n "$NOTARY_PRIVATE_KEY_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod +x scripts/release/notarize-with-api-key.sh
          scripts/release/notarize-with-api-key.sh \
            "$RUNNER_TEMP/release/iWebIT-${{ inputs.version }}-${{ inputs.build }}.pkg" \
            "$NOTARY_KEY_PATH" \
            "$RUNNER_TEMP/release"

      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: iWebIT-macOS-notarization-${{ inputs.version }}-${{ inputs.build }}
          path: |
            ${{ runner.temp }}/release/notary-submit.json
            ${{ runner.temp }}/release/notary-log.json
          if-no-files-found: warn

      - name: Create signed update manifest
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.IWEBIT_UPDATE_PRIVATE_KEY_BASE64 }}
          UPDATE_KEY_ID: ${{ secrets.IWEBIT_UPDATE_KEY_ID }}
          UPDATE_PUBLIC_KEY: ${{ secrets.IWEBIT_UPDATE_PUBLIC_KEY_BASE64 }}
        run: |
          swift run --package-path Packages/iWebITCore iwebit-update-manifest \
            --artifact "$RUNNER_TEMP/release/iWebIT-${{ inputs.version }}-${{ inputs.build }}.pkg" \
            --version "${{ inputs.version }}" \
            --build "${{ inputs.build }}" \
            --minimum-os "11.0" \
            --download-url "$PACKAGE_DOWNLOAD_URL" \
            --key-id "$UPDATE_KEY_ID" \
            --private-key-base64 "$UPDATE_PRIVATE_KEY" \
            --public-key-base64 "$UPDATE_PUBLIC_KEY" \
            --output "$RUNNER_TEMP/release/update-manifest.json"
          shasum -a 256 "$RUNNER_TEMP/release/iWebIT-${{ inputs.version }}-${{ inputs.build }}.pkg" \
            > "$RUNNER_TEMP/release/SHA256SUMS"

      - name: Upload notarized installer
        uses: actions/upload-artifact@v7
        with:
          name: iWebIT-macOS-${{ inputs.version }}-${{ inputs.build }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/iwebit-signing.keychain-db" || true

  ios-ipados-archive:
    needs: verify
    runs-on: macos-26
    environment: apple-release
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate required secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          bash scripts/ci/validate-required-secrets.sh \
            APPLE_TEAM_ID \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            CI_KEYCHAIN_PASSWORD

      - name: Install XcodeGen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen
      - name: Import Apple Distribution certificate and profile
        env:
          DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/ios-distribution.p12"
          PROFILE="$RUNNER_TEMP/iWebITMobile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          echo -n "$DISTRIBUTION_P12" | base64 --decode > "$CERT"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          DECODED_PROFILE="$RUNNER_TEMP/iWebITMobile-profile.plist"
          security cms -D -i "$PROFILE" > "$DECODED_PROFILE"
          PROFILE_UUID="$(plutil -extract UUID raw "$DECODED_PROFILE")"
          PROFILE_NAME="$(plutil -extract Name raw "$DECODED_PROFILE")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DECODED_PROFILE")"
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$DECODED_PROFILE")"
          if [[ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.app.iwebit.mobile" ]]; then
            echo "::error::The iOS/iPadOS profile is for '$PROFILE_APP_ID'; expected '$APPLE_TEAM_ID.app.iwebit.mobile'."
            exit 1
          fi
          if [[ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::The iOS/iPadOS profile belongs to team '$PROFILE_TEAM_ID'; expected '$APPLE_TEAM_ID'."
            exit 1
          fi
          security find-identity -v -p codesigning "$KEYCHAIN"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Prepare opaque App Store icon
        working-directory: iWebITMobile
        run: |
          swift ../scripts/release/prepare-mobile-app-icon.swift \
            ../iWebITAgent/Assets.xcassets/AppIcon.appiconset/logo_1024.png \
            Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          sips -g pixelWidth -g pixelHeight -g hasAlpha \
            Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          [[ "$(sips -g hasAlpha Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png | awk '/hasAlpha:/ {print $2}')" == "no" ]]

      - name: Archive universal iPhone and iPad app
        working-directory: iWebITMobile
        run: |
          xcodegen generate
          xcodebuild \
            -project iWebITMobile.xcodeproj \
            -scheme iWebITMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/iWebITMobile.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build }}" \
            archive

      - name: Export signed ipa
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE="$RUNNER_TEMP/iWebITMobile.mobileprovision"
          PROFILE_NAME="$(security cms -D -i "$PROFILE" | plutil -extract Name raw -)"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>app.iwebit.mobile</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iWebITMobile.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-release" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Validate exported app identity
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/ios-release" -name '*.ipa' -print -quit)"
          VERIFY_DIR="$RUNNER_TEMP/ios-verify"
          test -n "$IPA_PATH"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA_PATH" "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ACTUAL_BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Info.plist")"
          if [[ "$ACTUAL_BUNDLE_ID" != "app.iwebit.mobile" ]]; then
            echo "::error::Exported Bundle ID is '$ACTUAL_BUNDLE_ID'; expected 'app.iwebit.mobile'."
            exit 1
          fi
          plutil -extract CFBundleIconName raw "$APP_PATH/Info.plist" >/dev/null
          plutil -extract ITSAppUsesNonExemptEncryption raw "$APP_PATH/Info.plist" | grep -qx false

      - name: Validate TestFlight secrets
        if: inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          bash scripts/ci/validate-required-secrets.sh \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64

      - name: Upload signed ipa to TestFlight
        if: inputs.upload_to_testflight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          IPA_PATH="$(find "$RUNNER_TEMP/ios-release" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          mkdir -p "$KEY_DIR"
          echo -n "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 0600 "$KEY_PATH"
          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload signed ipa
        uses: actions/upload-artifact@v7
        with:
          name: iWebIT-iOS-iPadOS-${{ inputs.version }}-${{ inputs.build }}
          path: ${{ runner.temp }}/ios-release/*
          if-no-files-found: error

      - name: Remove temporary keychain and profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
  macos-app-store:
    needs: verify
    if: inputs.build_macos_app_store
    runs-on: macos-26
    environment: apple-release
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate Mac App Store signing secrets
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          MAC_INSTALLER_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_BASE64 }}
          MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD }}
          MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          CI_KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          bash scripts/ci/validate-required-secrets.sh \
            APPLE_TEAM_ID \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            MAC_INSTALLER_DISTRIBUTION_P12_BASE64 \
            MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD \
            MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 \
            CI_KEYCHAIN_PASSWORD

      - name: Install XcodeGen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Import App Store certificates and macOS profile
        env:
          APP_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          APP_DISTRIBUTION_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          INSTALLER_DISTRIBUTION_P12: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_BASE64 }}
          INSTALLER_DISTRIBUTION_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          APP_CERT="$RUNNER_TEMP/apple-distribution.p12"
          INSTALLER_CERT="$RUNNER_TEMP/mac-installer-distribution.p12"
          PROFILE="$RUNNER_TEMP/iWebITMacStore.provisionprofile"
          KEYCHAIN="$RUNNER_TEMP/mac-app-store-signing.keychain-db"
          echo -n "$APP_DISTRIBUTION_P12" | base64 --decode > "$APP_CERT"
          echo -n "$INSTALLER_DISTRIBUTION_P12" | base64 --decode > "$INSTALLER_CERT"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APP_CERT" -P "$APP_DISTRIBUTION_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security import "$INSTALLER_CERT" -P "$INSTALLER_DISTRIBUTION_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          INSTALLER_CERT_SHA="$(security find-certificate -c "Installer" -Z "$KEYCHAIN" | awk '/SHA-1 hash:/ { print $3; exit }')"
          INSTALLER_CERT_SUBJECT="$(security find-certificate -c "Installer" -p "$KEYCHAIN" | openssl x509 -noout -subject)"
          if [[ -z "$INSTALLER_CERT_SHA" ]]; then
            echo "::error::The installer P12 does not contain an installer certificate."
            exit 1
          fi
          case "$INSTALLER_CERT_SUBJECT" in
            *"3rd Party Mac Developer Installer"*|*"Mac Installer Distribution"*) ;;
            *)
              echo "::error::The installer P12 contains '$INSTALLER_CERT_SUBJECT'. Use a Mac App Store installer distribution certificate, not Developer ID Installer."
              exit 1
              ;;
          esac
          if ! security find-identity -v "$KEYCHAIN" | grep -Fq "$INSTALLER_CERT_SHA"; then
            echo "::error::The Mac App Store installer certificate was imported without its private key."
            exit 1
          fi
          echo "MAC_INSTALLER_CERT_SHA=$INSTALLER_CERT_SHA" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          DECODED_PROFILE="$RUNNER_TEMP/iWebITMacStore-profile.plist"
          security cms -D -i "$PROFILE" > "$DECODED_PROFILE"
          PROFILE_UUID="$(plutil -extract UUID raw "$DECODED_PROFILE")"
          PROFILE_NAME="$(plutil -extract Name raw "$DECODED_PROFILE")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$DECODED_PROFILE" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DECODED_PROFILE")"
          if [[ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.app.iwebit.mobile" ]]; then
            echo "::error::The macOS profile is for '$PROFILE_APP_ID'; expected '$APPLE_TEAM_ID.app.iwebit.mobile'."
            exit 1
          fi
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.provisionprofile"
          echo "MAC_STORE_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "MAC_STORE_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive sandboxed macOS App Store edition
        working-directory: iWebITMacStore
        run: |
          xcodegen generate
          xcodebuild \
            -project iWebITMacStore.xcodeproj \
            -scheme iWebITMacStore \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/iWebITMacStore.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$MAC_STORE_PROFILE_UUID" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ inputs.build }}" \
            archive

      - name: Validate archived Mac App Store identity and sandbox
        run: |
          APP_PATH="$RUNNER_TEMP/iWebITMacStore.xcarchive/Products/Applications/iWebIT.app"
          test -d "$APP_PATH"
          ACTUAL_BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw "$APP_PATH/Contents/Info.plist")"
          if [[ "$ACTUAL_BUNDLE_ID" != "app.iwebit.mobile" ]]; then
            echo "::error::Archived Bundle ID is '$ACTUAL_BUNDLE_ID'; expected 'app.iwebit.mobile'."
            exit 1
          fi
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/mac-store-entitlements.plist"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" "$RUNNER_TEMP/mac-store-entitlements.plist" | grep -qx true
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.network.client" "$RUNNER_TEMP/mac-store-entitlements.plist" | grep -qx true
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.aps-environment" "$RUNNER_TEMP/mac-store-entitlements.plist" | grep -qx production
          plutil -extract ITSAppUsesNonExemptEncryption raw "$APP_PATH/Contents/Info.plist" | grep -qx false

      - name: Export signed Mac App Store package
        run: |
          cat > "$RUNNER_TEMP/MacStoreExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>$MAC_INSTALLER_CERT_SHA</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>app.iwebit.mobile</key><string>$MAC_STORE_PROFILE_NAME</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iWebITMacStore.xcarchive" \
            -exportPath "$RUNNER_TEMP/macos-app-store-release" \
            -exportOptionsPlist "$RUNNER_TEMP/MacStoreExportOptions.plist"
          PKG_PATH="$(find "$RUNNER_TEMP/macos-app-store-release" -name '*.pkg' -print -quit)"
          test -n "$PKG_PATH"
          echo "MAC_STORE_PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Validate TestFlight API secrets
        if: inputs.upload_macos_to_testflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          bash scripts/ci/validate-required-secrets.sh \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY_BASE64

      - name: Upload macOS package to TestFlight
        if: inputs.upload_macos_to_testflight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          echo -n "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 0600 "$KEY_PATH"
          xcrun altool --validate-app -f "$MAC_STORE_PKG_PATH" -t macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$MAC_STORE_PKG_PATH" -t macos \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload signed macOS App Store package
        uses: actions/upload-artifact@v7
        with:
          name: iWebIT-macOS-AppStore-${{ inputs.version }}-${{ inputs.build }}
          path: ${{ runner.temp }}/macos-app-store-release/*
          if-no-files-found: error

      - name: Remove temporary Mac App Store signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mac-app-store-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$MAC_STORE_PROFILE_UUID.provisionprofile"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

  publish-macos-release:
    needs: [macos-installer, ios-ipados-archive]
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ inputs.version }}-${{ inputs.build }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: iWebIT-macOS-${{ inputs.version }}-${{ inputs.build }}
          path: ${{ runner.temp }}/github-release
      - name: Publish immutable GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; keeping its immutable signed assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/github-release/"* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "iWebIT ${{ inputs.version }} (${{ inputs.build }})" \
            --generate-notes